# Déploiement sur Render (« Blueprint ») : le serveur (FastAPI) et le site web (statique).
# Les secrets (MONGODB_URI, mot de passe du premier super administrateur) sont saisis PAR VOUS dans Render, jamais ici.
services:
  - type: web
    name: dialyse-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/sante
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_BASE
        value: dialyse
      - key: JWT_SECRET
        generateValue: true
      - key: SUPERADMIN_LOGIN
        sync: false
      - key: SUPERADMIN_MOT_DE_PASSE
        sync: false
      # Clé de chiffrement des sauvegardes (16 caractères minimum) : saisie PAR VOUS dans Render. À conserver en lieu sûr :
      # sans elle, aucune sauvegarde ne peut être relue ni restaurée.
      - key: SAUVEGARDE_CLE
        sync: false
      # Adresse du site web ci-dessous (autorise ses appels à l'API), ex. https://dialyse-web.onrender.com
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: dialyse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Adresse du serveur ci-dessus (sans « / » final), ex. https://dialyse-api.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite          # le site est une application à une seule page : toute adresse renvoie à index.html
        source: /*
        destination: /index.html
