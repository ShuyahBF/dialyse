# Déploiement sur Render (« Blueprint ») : le serveur (FastAPI) et le site web (statique).
# Les secrets (MONGODB_URI, mot de passe du premier super administrateur) sont saisis PAR VOUS dans Render, jamais ici.
services:
  - type: web
    name: dialyse-api
    # Nom de domaine de l'API (à relier chez le registraire par l'enregistrement DNS que Render indique)
    domains:
      - api.looisdialyse.space
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/sante
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_BASE
        value: dialyse
      - key: JWT_SECRET
        generateValue: true
      - key: SUPERADMIN_LOGIN
        sync: false
      - key: SUPERADMIN_MOT_DE_PASSE
        sync: false
      # Clé de chiffrement des sauvegardes (16 caractères minimum) : saisie PAR VOUS dans Render. À conserver en lieu sûr :
      # sans elle, aucune sauvegarde ne peut être relue ni restaurée.
      - key: SAUVEGARDE_CLE
        sync: false
      # WhatsApp par « Liluvine Standard » de SAWALI (Transmission universelle) : connexion par code, second facteur, « mot de passe oublié ».
      # La clé HMAC est celle de l'émetteur « dialyse » créé dans SAWALI : SECRET saisi PAR VOUS. Sans elle, les boutons WhatsApp sont masqués.
      - key: LILUVINE_WA_URL
        value: https://api.sawalismartsystems.com/api/webhook/liluvine-send
      - key: LILUVINE_WA_EMETTEUR
        value: dialyse
      - key: LILUVINE_WA_HMAC
        sync: false
      # Adresse du site web ci-dessous (autorise ses appels à l'API), https://looisdialyse.space
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: dialyse-web
    domains:
      - looisdialyse.space
      - www.looisdialyse.space
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Adresse du serveur ci-dessus (sans « / » final), https://api.looisdialyse.space
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite          # le site est une application à une seule page : toute adresse renvoie à index.html
        source: /*
        destination: /index.html
